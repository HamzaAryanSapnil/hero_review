services:
  db:
    image: postgres:16-alpine
    container_name: heroreview-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: heroreview
      POSTGRES_PASSWORD: heroreview
      POSTGRES_DB: hero_review
    ports:
      - "5433:5432"
    volumes:
      - heroreview_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heroreview -d hero_review"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  heroreview_pgdata:
