<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe3d2" />
      <stop offset="100%" stop-color="#f0b493" />
    </linearGradient>
  </defs>

  <!-- extruded side (depth) -->
  <rect x="4" y="8.5" width="56" height="55" rx="15" fill="url(#side)" />
  <!-- top face -->
  <rect x="4" y="4" width="56" height="55" rx="15" fill="url(#face)" />
  <!-- glass highlight -->
  <path
    d="M19 4h26c8.3 0 15 6.7 15 15v13.5c-9.4 5.6-21.6 7.4-33 5.1-9.3-1.9-17.5-6.7-23-13.2V19c0-8.3 6.7-15 15-15z"
    fill="#ffffff"
    opacity="0.09"
  />
  <!-- bevel edge light -->
  <rect x="5.2" y="5.2" width="53.6" height="52.6" rx="13.8" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.6" />

  <!-- double check: shadow layer for depth -->
  <g
    fill="none"
    stroke="#04060b"
    stroke-opacity="0.55"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(6.4 8.4) scale(2.15)"
  >
    <path d="M18 6 7 17l-5-5" />
    <path d="m22 10-7.5 7.5-1.5-1.5" />
  </g>
  <!-- double check: peach gradient face -->
  <g
    fill="none"
    stroke="url(#check)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(6.4 6) scale(2.15)"
  >
    <path d="M18 6 7 17l-5-5" />
    <path d="m22 10-7.5 7.5-1.5-1.5" />
  </g>
</svg>
